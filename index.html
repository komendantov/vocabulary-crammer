<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vocabulary Crammer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="views">
        <!-- Upload screen -->
        <section id="view-upload" class="view active">
          <button id="openSettings" class="gear" aria-label="Настройки">⚙️</button>
          <div class="card enter">
            <div class="home-title">Импорт словаря</div>
            <div class="home-sub">Загрузите CSV (две колонки)</div>
            <div class="home-controls">
              <label class="file-label">
                <input type="file" id="csvFile" accept=".csv" />
                <span class="file-btn">Выбрать CSV</span>
              </label>
              <button id="loadSample" class="ghost">Загрузить пример</button>
            </div>
            <div class="dataset-summary muted" id="datasetSummary">—</div>
            <div id="status" class="status">Загрузите CSV, чтобы продолжить.</div>
            <div class="home-actions">
              <button id="toModes" class="primary" disabled>Далее</button>
            </div>
          </div>
        </section>

        <!-- Modes screen -->
        <section id="view-modes" class="view">
          <button id="backUpload" class="back-btn">← Назад</button>
          <button id="openSettings2" class="gear" aria-label="Настройки">⚙️</button>
          <div class="card enter">
            <div class="home-title">Выбор режима</div>
            <div class="home-sub">Выберите, как хотите учить</div>

            <div class="tiles" id="modeTiles">
              <button class="tile selected" data-mode="flashcards" data-difficulty="beginner">
                <div class="tile-badge">🎯 РЕКОМЕНДУЕТСЯ</div>
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="6" width="16" height="12" rx="3"></rect>
                  <rect x="6" y="2" width="16" height="12" rx="3"></rect>
                </svg>
                <div class="tile-title">Флэш-карточки</div>
                <div class="tile-sub">Классическое запоминание с переворотом карт</div>
                <div class="tile-meta">✨ Адаптивный алгоритм повторений</div>
              </button>
              <button class="tile" data-mode="choice" data-difficulty="easy">
                <div class="tile-badge">📊 ПОПУЛЯРНО</div>
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/>
                </svg>
                <div class="tile-title">Множественный выбор</div>
                <div class="tile-sub">Выберите правильный ответ из 4 вариантов</div>
                <div class="tile-meta">🎮 Геймификация и быстрое обучение</div>
              </button>
              <button class="tile" data-mode="typing" data-difficulty="medium">
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="M6 8h.01M10 8h.01M14 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M6 16h.01M10 16h.01M14 16h.01"/>
                </svg>
                <div class="tile-title">Активный ввод</div>
                <div class="tile-sub">Набирайте перевод на клавиатуре</div>
                <div class="tile-meta">💪 Развивает моторную память</div>
              </button>
              <button class="tile" data-mode="matching" data-difficulty="medium">
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M8 2v20M16 2v20M2 8h20M2 16h20"/>
                  <circle cx="8" cy="8" r="2"/>
                  <circle cx="16" cy="16" r="2"/>
                </svg>
                <div class="tile-title">Сопоставление пар</div>
                <div class="tile-sub">Найдите соответствия между словами</div>
                <div class="tile-meta">🧩 Развивает ассоциативную память</div>
              </button>
              <button class="tile" data-mode="blitz" data-difficulty="hard">
                <div class="tile-badge">⚡ ЧЕЛЛЕНДЖ</div>
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <div class="tile-title">Блиц-режим</div>
                <div class="tile-sub">Максимум правильных ответов за минуту</div>
                <div class="tile-meta">🔥 Интенсивная тренировка скорости</div>
              </button>
              <button class="tile" data-mode="listening" data-difficulty="medium">
                <div class="tile-badge">🆕 НОВОЕ</div>
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <div class="tile-title">Аудирование</div>
                <div class="tile-sub">Слушайте произношение и угадывайте слова</div>
                <div class="tile-meta">🎧 Тренировка восприятия на слух</div>
              </button>
              <button class="tile" data-mode="reverse" data-difficulty="hard">
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="17 1 21 5 17 9"/>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
                <div class="tile-title">Обратный перевод</div>
                <div class="tile-sub">Переводите в обратном направлении</div>
                <div class="tile-meta">🔄 Углубленное изучение</div>
              </button>
              <button class="tile" data-mode="mixed" data-difficulty="expert">
                <div class="tile-badge">🎖️ ЭКСПЕРТ</div>
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <div class="tile-title">Смешанный режим</div>
                <div class="tile-sub">Случайная смесь всех режимов обучения</div>
                <div class="tile-meta">🌟 Максимальное разнообразие</div>
              </button>
            </div>

            <div class="home-sub" style="margin-top:10px">Направление</div>
            <div class="tiles two" id="dirTiles">
              <button class="tile selected" data-dir="ab">
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h13"/><polyline points="13 5 20 12 13 19"/></svg>
                <div class="tile-title" id="tileAB">A → B</div>
              </button>
              <button class="tile" data-dir="ba">
                <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H7"/><polyline points="11 5 4 12 11 19"/></svg>
                <div class="tile-title" id="tileBA">B → A</div>
              </button>
            </div>

            <div class="stack" style="margin-top:10px">
              <div class="home-row">
                <label class="switch"><input type="checkbox" id="includeLearned" /><span>Включать выученные</span></label>
                <label class="switch"><input type="checkbox" id="onlyUnlearned" /><span>Только невыученные</span></label>
                <button id="fillRemainingBtn" class="ghost" type="button">Все оставшиеся</button>
              </div>
              <label>Размер сессии: <span id="sizeVal">30</span></label>
              <input type="range" id="sizeRange" min="5" max="200" value="30" />
            </div>

            <div class="home-actions">
              <button id="startStudy" class="primary">Начать</button>
            </div>
          </div>
        </section>

        <!-- Study screen -->
        <section id="view-study" class="view">
          <div class="study-top">
            <button id="backModes" class="back-btn">← Режимы</button>
          </div>
          <div id="studyApp" class="app"></div>
          <div class="progress"><div id="progressBar" class="bar"></div></div>
          <div class="study-footer"><div id="studyStatsBottom" class="muted">—</div></div>
        </section>
      </main>

      <!-- Settings bottom sheet -->
      <div id="settingsBackdrop" class="sheet-backdrop hidden"></div>
      <div id="settingsSheet" class="sheet hidden" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Настройки</div>
          <div class="sheet-content">
            <div class="stack">
              <label>Тема</label>
              <div class="seg" id="themeSeg">
                <label><input type="radio" name="theme" value="pastel" checked /><span>Светлая</span></label>
                <label><input type="radio" name="theme" value="neon" /><span>Неон</span></label>
                <label><input type="radio" name="theme" value="indigo" /><span>Индиго</span></label>
              </div>
            </div>
            <div class="stack-row">
              <label class="switch"><input type="checkbox" id="hasHeader" checked /><span>Первая строка — заголовки</span></label>
            </div>
            <div class="stack-row">
              <label class="switch"><input type="checkbox" id="shuffleOrder" checked /><span>Перемешивать порядок слов</span></label>
            </div>
            <div class="home-row">
              <div class="stack small"><label for="streakToLearn">Правильных подряд</label><input type="number" id="streakToLearn" min="1" max="10" step="1" value="2" /></div>
            </div>
            <div class="home-row">
              <div class="stack"><label for="langA">Язык A</label><input type="text" id="langA" placeholder="Колонка 1" /></div>
              <div class="stack"><label for="langB">Язык B</label><input type="text" id="langB" placeholder="Колонка 2" /></div>
            </div>
            <div class="stack">
              <label for="speechLang">Язык произношения</label>
              <select id="speechLang">
                <option value="auto">Автоопределение</option>
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="ru-RU">Русский</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="es-ES">Español</option>
                <option value="it-IT">Italiano</option>
                <option value="ja-JP">日本語</option>
                <option value="ko-KR">한국어</option>
                <option value="zh-CN">中文</option>
              </select>
            </div>
          <div class="stack-row">
            <label class="switch"><input type="checkbox" id="showOnDontKnow" checked /><span>Показывать ответ при «Не знаю»</span></label>
          </div>
          <div class="home-row">
            <div class="stack small"><label for="showDelay">Задержка (мс)</label><input type="number" id="showDelay" min="500" max="5000" step="100" value="2000" /></div>
          </div>
          <div class="home-actions">
            <button id="resetProgress" class="ghost">Сбросить прогресс набора</button>
          </div>
        </div>
        <div class="sheet-actions">
          <button id="settingsClose" class="primary">Готово</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
